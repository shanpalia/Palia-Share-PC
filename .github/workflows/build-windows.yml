name: Build Palia Share Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Generate Windows platform
        shell: pwsh
        run: |
          if (!(Test-Path windows)) { flutter create . --platforms=windows --project-name palia_share_pc }

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick.app -y --no-progress
          $env:Path += ';C:\Program Files\ImageMagick-7.1.2-Q16-HDRI'
          magick -version

      - name: Apply Palia Share icon
        shell: pwsh
        run: |
          $magick = (Get-Command magick.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force windows\runner\resources | Out-Null
          & $magick assets\palia_share_icon.svg -background white -define icon:auto-resize=256,128,64,48,32,16 windows\runner\resources\app_icon.ico
          if (!(Test-Path windows\runner\resources\app_icon.ico)) { throw 'Palia Share icon was not generated.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup\ISCC.exe',
            'C:\Program Files\Inno Setup\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem 'C:\Program Files*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw 'Inno Setup ISCC.exe was not found after installation.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          if (-not $env:ISCC_PATH) { throw 'ISCC_PATH is not set.' }
          & $env:ISCC_PATH installer\PaliaShare.iss
          if (!(Test-Path 'installer\output\Palia Share Setup.exe')) { throw 'Installer was not created.' }

      - name: Upload Windows app folder
        uses: actions/upload-artifact@v4
        with:
          name: Palia-Share-Windows-Release
          path: build/windows/x64/runner/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Palia-Share-Setup
          path: installer/output/Palia Share Setup.exe
